<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Incidencias</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-8">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-3xl font-bold mb-6 text-center text-blue-600">Control de Incidencias</h1>
        
        <div class="mb-4 bg-blue-50 p-4 rounded text-sm text-blue-800 flex justify-between">
            <span id="visitas">Visitas al listado: 0</span>
            <span id="origen">Datos obtenidos de: -</span>
        </div>

        <!-- Formulario -->
        <div class="mb-8 p-4 border border-gray-200 rounded">
            <h2 class="text-xl font-semibold mb-4">Nueva Incidencia</h2>
            <form id="formIncidencia" class="space-y-4">
                <div>
                    <input type="text" id="titulo" placeholder="Título de la incidencia" required class="w-full p-2 border rounded">
                </div>
                <div>
                    <textarea id="descripcion" placeholder="Descripción detallada" required class="w-full p-2 border rounded"></textarea>
                </div>
                <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 transition">Registrar Incidencia</button>
            </form>
        </div>

        <!-- Tabla -->
        <table class="w-full text-left border-collapse">
           <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-gray-200">
                    <th class="p-3 border">ID</th>
                    <th class="p-3 border">Título</th>
                    <th class="p-3 border">Descripción</th>
                    <th class="p-3 border">Estado</th>
                    <th class="p-3 border text-center">Acciones</th>
                </tr>
            </thead>
            <tbody id="listaIncidencias">
                <!-- Llenado por JS -->
            </tbody>
        </table>
    </div>

    <script src="app.js"></script>
</body>
</html>
