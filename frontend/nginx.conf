server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Reescribe la URL quitando /api/ para que el backend de PHP entienda las rutas limpias
        rewrite ^/api/(.*)$ /$1 break;
        
        # Manda la petición al contenedor backend en su red interna
        proxy_pass http://backend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}